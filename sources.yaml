# Feeds the bot reads. Each belongs to exactly one category id from topics.yaml.
# Add a feed: copy a block, change name/url/category. Check it with: python scripts/check_feeds.py
# Reuters and AP have no public RSS, so they come through Google News searches (titles end in " - Reuters").

# ---- Tech & AI drama ----
- name: Reuters Technology
  url: "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=site:reuters.com+(AI+OR+technology)+when:1d"
  category: tech-ai
  strip_title_suffix: " - Reuters"
- name: Reuters Media
  url: "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=site:reuters.com+media+when:1d"
  category: tech-ai
  strip_title_suffix: " - Reuters"
- name: AP Technology
  url: "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=site:apnews.com+technology+when:1d"
  category: tech-ai
  strip_title_suffix: " - AP News"
- name: BBC Technology
  url: https://feeds.bbci.co.uk/news/technology/rss.xml
  category: tech-ai
- name: TechCrunch
  url: https://techcrunch.com/feed/
  category: tech-ai
- name: TechCrunch AI
  url: https://techcrunch.com/category/artificial-intelligence/feed/
  category: tech-ai
- name: TechCrunch Startups
  url: https://techcrunch.com/category/startups/feed/
  category: tech-ai

- name: The Verge
  url: https://www.theverge.com/rss/index.xml
  category: tech-ai
- name: Windows Central
  url: https://www.windowscentral.com/feeds/all
  category: tech-ai
- name: 9to5Mac
  url: https://9to5mac.com/feed/
  category: tech-ai

