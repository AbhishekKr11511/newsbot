# backend: claude-code uses your Claude Pro/Max login via the `claude` CLI (no API bill).
#          api uses ANTHROPIC_API_KEY (pay per token); then set model to a full id like claude-sonnet-5-5.
backend: claude-code
model: haiku            # haiku | sonnet  (claude-code backend)
effort: medium          # api backend only: low | medium | high
per_source_cap: 15      # newest N articles per feed sent to Claude
window_hours: 24
picks_retention_days: 30
max_post_chars: 280
card_handle: "@yourhandle"   # shown on the stat cards — put your X handle here
card_tagline: ""             # optional, bottom-left of the card
fetch_timeout_s: 15
banned_words:
  - game-changer
  - game changer
  - masterstroke
  - master-stroke
  - revolutionary
