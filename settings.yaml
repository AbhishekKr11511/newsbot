# backend: claude-code uses your Claude Pro/Max login via the `claude` CLI (no API bill).
#          api uses ANTHROPIC_API_KEY (pay per token); then set model to a full id like claude-sonnet-5-5.
backend: claude-code
model: haiku            # haiku | sonnet  (claude-code backend)
effort: medium          # api backend only: low | medium | high
per_source_cap: 15      # newest N articles per feed sent to Claude
window_hours: 24
picks_retention_days: 30
max_post_chars: 280
card_handle: "@nomicsexpress"   # shown on the stat cards
card_tagline: ""             # optional, bottom-left of the card
fetch_timeout_s: 15
banned_words:
  - game-changer
  - game changer
  - masterstroke
  - master-stroke
  - revolutionary
images:                 # v1.4 image finder (see README)
  enabled: true
  sources: [wikimedia, steam, openverse]
  ollama_url: http://localhost:11434
  ollama_model: gemma3:4b   # vision model; try qwen2.5vl:7b if picks look off
  keep: 4                   # images shown per pick
  max_scored: 8             # images judged per pick
  min_score: 5              # 0-10; below this an image is dropped
  budget_s: 300             # time limit for the whole image step
