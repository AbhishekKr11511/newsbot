# Categories the bot curates. Each gets its own Claude call and its own tab.
# Goal: posts a regular person can have an opinion on, and that start arguments in the comments.
- id: gaming
  name: Gaming
  max_picks: 3
  covers: "Gaming drama and big moments: fan backlash, review-bombing, user vs critic score splits, studio and publisher controversies, price rises, delays, layoffs, leaks, cancelled games, big sales or flop numbers, console and Game Pass changes, famous developers saying something bold"
  skip: routine reviews, trailers with no news, deals posts, guides, patch notes with nothing controversial, esports results
- id: tech-ai
  name: Tech & AI drama
  max_picks: 3
  covers: "Tech and AI drama regular people feel: famous CEOs (Musk, Altman, Zuckerberg, Huang, Nadella, Pichai, Cook, Amodei) saying or doing something wild, AI taking jobs, AI controversies and lawsuits, privacy scandals, bans, major outages (Outlook, AWS, Cloudflare, banks, airlines, PSN/Xbox Live: these are trending), price hikes, forced features, Windows/iPhone/Android changes that annoy or delight users"
  skip: enterprise software deals, funding rounds with no wider story, chip-industry jargon, product how-tos, minor app updates
- id: trending
  name: Trending for everyone
  max_picks: 1
  covers: "Only a story that a regular person anywhere would care about and that could trend: a shock collapse of a household brand, a price change everyone pays, a viral controversy, a huge job-loss story, a major outage. India stories count when they affect everyday people"
  skip: market wraps, earnings, central bank decisions, politics with no everyday impact, funding rounds, anything you'd need finance knowledge to care about. Picking nothing is the normal answer.
