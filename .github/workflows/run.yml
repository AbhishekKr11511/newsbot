name: newsbot

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours (UTC); GitHub may start it a few minutes late
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        id: bot
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m newsbot

      - name: Commit data
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: run $(date -u +%FT%TZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: Upload site
        if: env.DRY_RUN != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy site
        id: deploy
        if: env.DRY_RUN != 'true'
        uses: actions/deploy-pages@v4

      - name: Fail if the bot failed
        if: steps.bot.outcome == 'failure'
        run: |
          echo "The bot reported a failure. Open the 'Run bot' step above to see which category or feed."
          exit 1
